# Input: the transaction topic and every table topic of the connector, by pattern
transactions.input-pattern=dbserver1\\.(transaction|inventory\\..*)
transactions.output-topic=aggregated-transactions
# A transaction still open after this time is emitted as INCOMPLETE
transactions.timeout=5M
# How often open transactions are checked against the timeout
transactions.punctuation-interval=1S
# How long emitted transactions are remembered, to drop events replayed by the connector;
# must be greater than the timeout
transactions.marker-retention=10M

quarkus.kafka-streams.bootstrap-servers=localhost:9092
quarkus.kafka-streams.application-id=kstreams-transaction-aggregator

kafka-streams.processing.guarantee=exactly_once_v2
kafka-streams.commit.interval.ms=1000
kafka-streams.metadata.max.age.ms=500
