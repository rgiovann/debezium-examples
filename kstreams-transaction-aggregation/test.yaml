name: kstreams-transaction-aggregation
description: >
  Tests the Debezium PostgreSQL connector with transaction metadata and the Kafka Streams aggregator:
  one transaction that updates a customer and inserts two orders is published on the
  aggregated-transactions topic as a single COMPLETE message.
env_file: ../.env
compose_file: docker-compose.yaml

cleanup:
  type: docker_compose_down
  volumes: true

steps:
  - name: Ensure clean state before starting
    type: docker_compose_down
    volumes: true

  - name: Build the aggregator image
    type: docker_compose_build
    services:
      - aggregator

  - name: Start all services
    type: docker_compose_up
    detach: true

  - name: Wait for Kafka Connect REST API to be ready
    type: http_wait
    url: http://localhost:8083/connectors
    timeout_seconds: 300
    interval_seconds: 5

  - name: Register Debezium PostgreSQL connector
    type: http_put
    url: http://localhost:8083/connectors/inventory-connector/config
    body_file: register-postgres.json
    expected_status: [200, 201]

  - name: Wait for connector to be RUNNING
    type: http_wait
    url: http://localhost:8083/connectors/inventory-connector/status
    timeout_seconds: 60
    interval_seconds: 5
    expected_json_path: connector.state
    expected_value: RUNNING

  - name: Wait for the aggregator to be RUNNING
    type: wait_for_log
    service: aggregator
    expected_content: State transition from REBALANCING to RUNNING
    timeout_seconds: 180

  - name: Run a transaction that updates a customer and inserts two orders
    type: docker_compose_exec
    service: postgres
    command: "psql -U postgres -c \"BEGIN; UPDATE inventory.customers SET email = 'sally.novo@example.com' WHERE id = 1001; INSERT INTO inventory.orders (order_date, purchaser, quantity, product_id) VALUES (CURRENT_DATE, 1001, 2, 102); INSERT INTO inventory.orders (order_date, purchaser, quantity, product_id) VALUES (CURRENT_DATE, 1001, 1, 105); COMMIT;\""

  - name: Verify the transaction is published as one COMPLETE message
    type: kafka_consume
    topic: aggregated-transactions
    timeout_seconds: 60
    expected_content:
      - '"status":"COMPLETE"'
      - '"inventory.customers"'
      - '"inventory.orders"'
